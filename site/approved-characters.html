<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>40 隻角色｜立體角色展示</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2efe5;color:#354a41;font:17px/1.6 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:24px}h1{margin:6px 0;font-size:32px}p{margin:8px 0}small,.sub{color:#6d786c}button,select{font:inherit;color:inherit;border:1px solid #c6d2bf;border-radius:12px;background:#fffcf3;padding:9px 13px;cursor:pointer}button[aria-pressed=true],button:hover{background:#dae8ce;border-color:#7e986a}button:focus-visible,select:focus-visible{outline:3px solid #be884c;outline-offset:3px}.filters,.actions,.views{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px}#viewport{height:590px;position:relative;background:#e2e9df;border-radius:25px;overflow:hidden;touch-action:none}canvas{display:block}.hint{position:absolute;bottom:12px;left:14px;padding:5px 10px;border-radius:10px;background:#fffbedcf;pointer-events:none;font-size:14px}aside{padding:20px;border-radius:24px;background:#fffdf4;border:1px solid #d5ddcc}#status{padding:12px;background:#ebefdf;border-radius:12px;min-height:65px}#cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:20px 0}.card{text-align:left;min-height:82px}.card b,.card small{display:block}.card[hidden]{display:none}a{color:#456e4d}label{display:block;margin:12px 0}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#edf1e5d9;color:#486642;font-size:20px}#loading[hidden]{display:none}@media(max-width:850px){.layout{grid-template-columns:1fr}#viewport{height:450px}#cards{grid-template-columns:repeat(2,1fr)}main{padding:14px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main><small>MATH MISSION · 原創角色展示</small><h1>40 隻角色・立體展示室</h1><p>40 隻原創角色，可旋轉、縮放與切換動作。這是角色展示頁；回到數學任務站可選傳統作答、怪物對戰或收集精靈。展示全部角色不代表已解鎖。</p><div class="filters" id="filters"></div><div class="layout"><div id="viewport" aria-label="可旋轉角色模型"><div class="hint">拖曳旋轉 · 滾輪縮放</div><div id="loading" role="status">正在準備模型…</div></div><aside><small id="kind"></small><h2 id="name">載入中</h2><p id="description"></p><div class="actions"><button data-mode="idle">待機</button><button data-mode="walk">移動</button><button data-mode="attack">攻擊動作</button><button data-mode="guard">防守</button><button data-mode="hurt">受擊</button></div><p id="status" aria-live="polite"></p><div class="views"><button data-view="front">正面</button><button data-view="side">側面</button><button data-view="back">背面</button><button id="reset">重設視角</button></div><label>動作速度 <input id="speed" type="range" min=".35" max="1.5" step=".05" value="1"></label><button id="pause">暫停動作</button><p class="sub">這裡的攻擊只展示動作，未連接傷害、解鎖獎勵或正式學生紀錄。</p><div class="views"><button id="prev">上一隻</button><button id="next">下一隻</button></div></aside></div><h2>選擇角色 <small id="count"></small></h2><div id="cards"></div><p><a href="/app">回到數學任務站</a></p></main><script type="module" src="character-gallery.js?v=20261027"></script></body></html>
